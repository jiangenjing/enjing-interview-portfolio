<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Deep Research：Supervisor 与并行研究、红队和裁判反馈</title><desc id="desc">三个 Research Agent 并行研究，研究笔记经压缩汇总，再通过模型裁判和红队反馈迭代报告。架构根据简历描述整理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#94a3b2" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;fill:#243341}.title{font-size:21px;font-weight:600}.body{font-size:17px;fill:#52616f}.kicker{font-size:12px;letter-spacing:1px;fill:#61798e;font-weight:600}.small{font-size:15px;fill:#647585}</style>
<rect width="1120" height="790" rx="28" fill="#fff"/>
<text class="small" x="32" y="40">编排、信息压缩与质量反馈 · 根据简历描述整理</text><rect x="30" y="70" width="270" height="136" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="kicker" x="52" y="99">01 · BRIEF</text><text class="title" x="52" y="129">研究问题 → 提纲</text><text class="body" x="52" y="161">明确范围与交付要求</text><text class="body" x="52" y="187">生成报告草稿</text><rect x="390" y="70" width="340" height="136" rx="22" fill="#f2eff8" stroke="#e0e4e9"/><text class="kicker" x="412" y="99">02 · ORCHESTRATE</text><text class="title" x="412" y="129">Supervisor</text><text class="body" x="412" y="161">规划 / 委派 / 聚合 / 修订</text><text class="body" x="412" y="187">最多 15 轮动态研究迭代</text><rect x="820" y="70" width="270" height="136" rx="22" fill="#edf4f0" stroke="#e0e4e9"/><text class="kicker" x="842" y="99">05 · DELIVER</text><text class="title" x="842" y="129">带引用的研究报告</text><text class="body" x="842" y="161">关键事实 + 内联引用</text><text class="body" x="842" y="187">来源清单与压缩摘要</text><path d="M300 138 H382" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M730 138 H812" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="276" width="310" height="144" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="kicker" x="52" y="305">03 · PARALLEL RESEARCH</text><text class="title" x="52" y="335">Researcher A</text><text class="body" x="52" y="367">ReAct + Tool Calling</text><text class="body" x="52" y="393">检索 → 阅读 → 提炼事实</text><rect x="405" y="276" width="310" height="144" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="kicker" x="427" y="305">03 · PARALLEL RESEARCH</text><text class="title" x="427" y="335">Researcher B</text><text class="body" x="427" y="367">ReAct + Tool Calling</text><text class="body" x="427" y="393">检索 → 阅读 → 提炼事实</text><rect x="780" y="276" width="310" height="144" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="kicker" x="802" y="305">03 · PARALLEL RESEARCH</text><text class="title" x="802" y="335">Researcher C</text><text class="body" x="802" y="367">ReAct + Tool Calling</text><text class="body" x="802" y="393">检索 → 阅读 → 提炼事实</text><path d="M560 206 V239 H185 V268" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M560 239 V268" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M560 239 H935 V268" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="476" width="1060" height="107" rx="22" fill="#edf4f0" stroke="#e0e4e9"/><text class="title" x="52" y="514">研究结果聚合与上下文压缩</text><text class="body" x="52" y="546">URL 去重 / 长文摘要 / Auto-Compact → 保留关键事实、引用与来源清单</text><path d="M185 420 V468" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M560 420 V468" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M935 420 V468" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="636" width="510" height="116" rx="22" fill="#f2eff8" stroke="#e0e4e9"/><text class="title" x="52" y="674">LLM-as-Judge</text><text class="body" x="52" y="706">全面性 / 准确性 / 一致性 → 结构化质量反馈</text><rect x="580" y="636" width="510" height="116" rx="22" fill="#f8f3eb" stroke="#e0e4e9"/><text class="title" x="602" y="674">Red Team</text><text class="body" x="602" y="706">识别漏洞 → Critique → 修复，最多 3 轮</text><path d="M285 583 V628" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M835 583 V628" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1090 696 H1106 V226 H740" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text class="small" x="771" y="254">质量反馈 → 下一轮修订</text></svg>