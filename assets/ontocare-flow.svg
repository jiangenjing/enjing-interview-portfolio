<text class="small" x="32" y="40">服务链路 · 模型负责理解与表达，显式规则限定业务动作</text><rect x="30" y="70" width="244" height="146" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="kicker" x="52" y="99">01 · INPUT</text><text class="title" x="52" y="129">多模态求助</text><text class="body" x="52" y="161">文本 / 图片 / 视频采样</text><text class="body" x="52" y="187">提取可见事实与不确定项</text><rect x="302" y="70" width="244" height="146" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="kicker" x="324" y="99">02 · CONTEXT</text><text class="title" x="324" y="129">案件理解与消歧</text><text class="body" x="324" y="161">关联型号、候选订单</text><text class="body" x="324" y="187">保留已尝试步骤</text><rect x="574" y="70" width="244" height="146" rx="22" fill="#edf4f0" stroke="#e0e4e9"/><text class="kicker" x="596" y="99">03 · GROUNDING</text><text class="title" x="596" y="129">限定证据与业务规则</text><text class="body" x="596" y="161">型号范围检索 / 错误码</text><text class="body" x="596" y="187">证据校验 / 允许动作</text><rect x="846" y="70" width="244" height="146" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="kicker" x="868" y="99">04 · RESPONSE</text><text class="title" x="868" y="129">答复与审核材料</text><text class="body" x="868" y="161">引用式排障 / 邮件草稿</text><text class="body" x="868" y="187">高风险诉求交接人工</text><path d="M274 143 H298" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M546 143 H570" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M818 143 H842" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="286" width="244" height="134" rx="22" fill="#f8f3eb" stroke="#e0e4e9"/><text class="title" x="52" y="324">工单集合</text><text class="body" x="52" y="356">63 条脱敏快照</text><text class="body" x="52" y="382">统计 + 四类候选归因</text><rect x="302" y="286" width="244" height="134" rx="22" fill="#edf4f0" stroke="#e0e4e9"/><text class="title" x="324" y="324">Service Ontology</text><text class="body" x="324" y="356">产品 / 订单 / 知识 / 证据</text><text class="body" x="324" y="382">JSON 实体关系</text><rect x="574" y="286" width="244" height="134" rx="22" fill="#edf4f0" stroke="#e0e4e9"/><text class="title" x="596" y="324">Decision Ontology</text><text class="body" x="596" y="356">质保 / 渠道 / 升级条件</text><text class="body" x="596" y="382">Python 显式规则</text><rect x="846" y="286" width="244" height="134" rx="22" fill="#f8f3eb" stroke="#e0e4e9"/><text class="title" x="868" y="324">经营归因与下钻</text><text class="body" x="868" y="356">ReadOntology / ReadTrace</text><text class="body" x="868" y="382">规则 ID · 行号 · 工单原文</text><path d="M424 286 V224" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M696 286 V224" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M152 420 V452 H968 V428" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="small" x="445" y="445">集合分析 → 可核查的经营建议</text><rect x="30" y="492" width="1060" height="132" rx="22" fill="#f5f5f7"/><text class="title" x="54" y="537">发现问题</text><text class="body" x="54" y="574">Persona 多轮对抗</text><text class="title" x="324" y="537">联合评测</text><text class="body" x="324" y="574">硬断言 + LLM Judge</text><text class="title" x="594" y="537">人工核查与修正</text><text class="body" x="594" y="574">知识 / 规则 / 代码</text><text class="title" x="864" y="537">回归验证</text><text class="body" x="864" y="574">保存版本与测试记录</text><path d="M265 550 H299" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M535 550 H569" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M805 550 H839" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1090 550 H1106 V246 H696 V224" fill="none" stroke="#94a3