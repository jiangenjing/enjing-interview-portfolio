<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">追觅海外 GTM 实习：资料、用户洞察、商业测算与策略输出</title><desc id="desc">市场研究、用户分析、商业测算与汇报的工作流。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#94a3b2" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;fill:#243341}.title{font-size:21px;font-weight:600}.body{font-size:17px;fill:#52616f}.kicker{font-size:12px;letter-spacing:1px;fill:#61798e;font-weight:600}.small{font-size:15px;fill:#647585}</style>
<rect width="1120" height="650" rx="28" fill="#fff"/>
<text class="small" x="32" y="40">实习工作链路 · 从市场信息到可讨论、可测算的 GTM 建议</text><rect x="30" y="100" width="238" height="172" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="kicker" x="52" y="129">01 · WORK</text><text class="title" x="52" y="159">整合多源资料</text><text class="body" x="52" y="191">30+ 行业报告 / 5 大平台</text><text class="body" x="52" y="217">8,000+ 评论 / 6 个头部竞品</text><path d="M268 186 H298" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="304" y="100" width="238" height="172" rx="22" fill="#edf4f0" stroke="#e0e4e9"/><text class="kicker" x="326" y="129">02 · WORK</text><text class="title" x="326" y="159">提炼用户与定位</text><text class="body" x="326" y="191">运动健康诉求 / 价格区间</text><text class="body" x="326" y="217">3 类分层画像 / 渠道偏好</text><path d="M542 186 H572" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="578" y="100" width="238" height="172" rx="22" fill="#f2eff8" stroke="#e0e4e9"/><text class="kicker" x="600" y="129">03 · WORK</text><text class="title" x="600" y="159">商业情景测算</text><text class="body" x="600" y="191">订单规模 / FOB 与 DAP</text><text class="body" x="600" y="217">成本、返利与渠道利润</text><path d="M816 186 H846" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="852" y="100" width="238" height="172" rx="22" fill="#f8f3eb" stroke="#e0e4e9"/><text class="kicker" x="874" y="129">04 · WORK</text><text class="title" x="874" y="159">形成 GTM 材料</text><text class="body" x="874" y="191">差异化定位 / 渠道建议</text><text class="body" x="874" y="217">HTML 看板与管理汇报</text><rect x="30" y="347" width="510" height="148" rx="22" fill="#edf4f0" stroke="#e0e4e9"/><text class="title" x="52" y="385">研究产出</text><text class="body" x="52" y="417">竞品矩阵 · 用户画像 · 定位假设</text><text class="body" x="52" y="443">把分散信息整理为可解释的策略依据</text><rect x="580" y="347" width="510" height="148" rx="22" fill="#f2eff8" stroke="#e0e4e9"/><text class="title" x="602" y="385">量化决策产出</text><text class="body" x="602" y="417">价值链模型 · 情景模拟 · 敏感性分析</text><text class="body" x="602" y="443">让定价、贸易条款与返利方案可以比较</text><path d="M423 272 V309 H285 V339" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M697 272 V309 H835 V339" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="547" width="1060" height="70" rx="20" fill="#f5f5f7"/><text class="small" x="58" y="590">与模型产品 GTM 的连接：需求归纳 → 价值表达 → 商业约束 → 可展示材料 → 反馈迭代</text></svg>