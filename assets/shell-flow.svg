能匹配</text><text class="body" x="326" y="363">时间 / 价格 / 可靠性</text><text class="body" x="326" y="389">到站转化 · 到站成功</text><path d="M697 218 V264" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="578" y="272" width="238" height="156" rx="22" fill="#f2eff8" stroke="#e0e4e9"/><text class="kicker" x="600" y="301">03 · DECISION</text><text class="title" x="600" y="331">功率优化与运维</text><text class="body" x="600" y="363">约束调度 / 异常工单</text><text class="body" x="600" y="389">电费 · MTTR</text><path d="M971 218 V264" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="852" y="272" width="238" height="156" rx="22" fill="#f8f3eb" stroke="#e0e4e9"/><text class="kicker" x="874" y="301">04 · DECISION</text><text class="title" x="874" y="331">因果增量运营</text><text class="body" x="874" y="363">用户分层 / Uplift / A/B</text><text class="body" x="874" y="389">30 天复充 · 增量 ROI</text><path d="M149 428 V470 H971" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M423 428 V470" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M697 428 V470" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M971 428 V470" fill="none" stroke="#94a3b2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="514" width="326" height="110" rx="22" fill="#edf4fb" stroke="#e0e4e9"/><text class="title" x="52" y="552">车主侧体验</text><text class="body" x="52" y="584">AI 智选 → 预约 → 充电 → 权益</text><rect x="397" y="514" width="326" height="110" rx="22" fill="#edf4f0" stroke="#e0e4e9"/><text class="title" x="419" y="552">经营侧验收</text><text class="body" x="419" y="584">订单 / 停机 / 收益的统一口径</text><rect x="764" y="514" width="326" height="110" rx="22" fill="#f8f3eb" stroke="#e0e4e9"/><text class="title" x="786" y="552">商业化试点</text><text class="body" x